version: '3.8'

services:
  laravel:
    image: 'php:8.3-fpm'
    container_name: witi-sms
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  mysql:
    image: 'mysql:5.7'
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - '3306:3306'
    networks:
      - sail
  
  redis:
    image: 'redis:alpine'
    container_name: redis
    ports:
      - '6379:6379'
    networks:
      - sail

  phpmyadmin:
    image: 'phpmyadmin/phpmyadmin'
    container_name: phpmyadmin-container
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '8081:80'
    depends_on:
      - mysql
    networks:
      - sail

networks:
  sail:
    driver: bridge
